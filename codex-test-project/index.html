<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Test Project</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <p class="eyebrow">Local test app</p>
        <h1>Codex Test Project</h1>
        <p class="lede">
          A small static project for checking HTML, CSS, and JavaScript wiring.
        </p>

        <div class="counter" aria-live="polite">
          <span class="counter-label">Button presses</span>
          <strong id="count">0</strong>
        </div>

        <div class="actions">
          <button id="increment" type="button">Add one</button>
          <button id="reset" type="button" class="secondary">Reset</button>
        </div>
      </section>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
